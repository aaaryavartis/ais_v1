name: Preview — PR Deploy to Netlify

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'

jobs:
  preview:
    name: 🔍 Netlify Preview Deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build for preview
        run: npm run build
        env:
          # Use staging/preview Supabase project for PRs
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy preview to Netlify
        id: preview-deploy
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.next'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR #${{ github.event.pull_request.number }} preview — ${{ github.sha }}"
          alias: pr-${{ github.event.pull_request.number }}
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10

      - name: Post preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.preview-deploy.outputs.deploy-url }}';
            const prNumber = context.issue.number;
            const sha = context.sha.slice(0, 7);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔍 Netlify Preview')
            );

            const body = `## 🔍 Netlify Preview Deployment

| | |
|---|---|
| **Status** | ✅ Ready |
| **Preview URL** | ${previewUrl} |
| **Supabase** | Staging DB (isolated from production) |
| **Commit** | \`${sha}\` |
| **Branch** | \`${{ github.head_ref }}\` |

> Preview updates automatically on every new commit to this PR.
> _Last updated: ${new Date().toUTCString()}_`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
