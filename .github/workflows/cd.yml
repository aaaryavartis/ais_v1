name: CD — Deploy to Netlify Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run Supabase DB migrations?'
        required: false
        default: 'true'
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Run Supabase DB Migrations
  # ─────────────────────────────────────────────
  migrate:
    name: 🗄️ Supabase DB Migrate
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_migrations != 'false' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase migrations
        run: |
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations)" ]; then
            supabase db push --linked
            echo "✅ Migrations applied successfully"
          else
            echo "ℹ️ No migrations to apply"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to Netlify Production
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Netlify
    runs-on: ubuntu-latest
    needs: migrate
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    environment:
      name: production
      url: ${{ steps.netlify-deploy.outputs.deploy-url }}
    outputs:
      deploy_url: ${{ steps.netlify-deploy.outputs.deploy-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy to Netlify
        id: netlify-deploy
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.next'
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Production deploy — ${{ github.sha }} by ${{ github.actor }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
          enable-github-deployment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10

  # ─────────────────────────────────────────────
  # JOB 3: Post-deploy Health Check
  # ─────────────────────────────────────────────
  health-check:
    name: 🩺 Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for Netlify to warm up
        run: sleep 20

      - name: Check site responds (HTTP 200)
        run: |
          SITE_URL="${{ secrets.NETLIFY_SITE_URL }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed! Status: $STATUS"
            exit 1
          fi
          echo "✅ Site is live and healthy!"

      - name: Check Supabase connectivity
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/")
          echo "Supabase API Status: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "⚠️ Supabase connectivity check failed (Status: $RESPONSE)"
          else
            echo "✅ Supabase is reachable!"
          fi

  # ─────────────────────────────────────────────
  # JOB 4: Notify (Slack / Email)
  # ─────────────────────────────────────────────
  notify:
    name: 📣 Notify Team
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always()
    steps:
      - name: Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ needs.health-check.result == 'success' && '✅ *Production Deploy Succeeded*' || '❌ *Production Deploy Failed*' }}\n*App:* ais_v1 | *Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Actor:* ${{ github.actor }}\n*Site:* ${{ secrets.NETLIFY_SITE_URL }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
